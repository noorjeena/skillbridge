{% extends 'base.html' %}
{% block title %}Delete Assignment | SkillBridge{% endblock %}
{% block content %}
<section class="auth-panel mx-auto p-4 p-md-5">
    <h1 class="h3 fw-semibold mb-2">Delete assignment?</h1>
    <p class="text-secondary">This will permanently remove “{{ object.title }}” and its submissions.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-danger" type="submit">Delete Assignment</button>
            <a class="btn btn-outline-secondary" href="{% url 'learning:assignment-detail' object.pk %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
