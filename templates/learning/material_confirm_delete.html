{% extends 'base.html' %}
{% block title %}Delete Material | SkillBridge{% endblock %}
{% block content %}
<section class="auth-panel mx-auto p-4 p-md-5">
    <h1 class="h3 fw-semibold mb-2">Delete learning material?</h1>
    <p class="text-secondary">This will remove “{{ object.title }}” from {{ object.lesson.title }}.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-danger" type="submit">Delete Material</button>
            <a class="btn btn-outline-secondary" href="{% url 'learning:lesson-materials' object.lesson_id %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
