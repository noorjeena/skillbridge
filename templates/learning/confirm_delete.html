{% extends 'base.html' %}
{% block title %}Delete {{ item_type }} | SkillBridge{% endblock %}
{% block content %}
<section class="auth-panel mx-auto p-4 p-md-5">
    <h1 class="h3 fw-semibold mb-2">Delete {{ item_type }}?</h1>
    <p class="text-secondary">This will permanently remove “{{ object }}”.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-danger" type="submit">Delete</button>
            <a class="btn btn-outline-secondary" href="{% url 'learning:directions' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
