{% extends 'base.html' %}
{% block title %}Delete Skill | SkillBridge{% endblock %}
{% block content %}
<section class="auth-panel skill-delete-panel mx-auto p-4 p-md-5">
    <h1 class="h3 fw-semibold mb-2">Delete {{ view.object.skill.name }}?</h1>
    <p class="text-secondary">This removes this {{ record_type }} from your profile. The shared skill catalogue will not be affected.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-danger" type="submit">Delete</button>
            <a class="btn btn-outline-secondary" href="{% url 'skills:index' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
